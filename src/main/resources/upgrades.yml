# ===================================================================
# Upgrades
# ===================================================================
# Each upgrade lists its levels as consecutive integer keys ('1', '2', ...).
# An island with no stored level is at the lowest key. `require-level` is the
# island level needed to buy that level and `price` is charged through Vault
# from the buying member's balance; the lowest level needs neither.
upgrades:
  # Island width in blocks (75 means 75x75).
  island-size:
    '1':
      size: 75
    '2':
      require-level: 200
      price: 60000
      size: 100
    '3':
      require-level: 450
      price: 180000
      size: 125
    '4':
      require-level: 850
      price: 450000
      size: 150
    '5':
      require-level: 1400
      price: 1000000
      size: 175

  # Maximum co-op members of an island.
  coop-limit:
    '1':
      limit: 1
    '2':
      require-level: 100
      price: 25000
      limit: 2
    '3':
      require-level: 250
      price: 80000
      limit: 3
    '4':
      require-level: 500
      price: 200000
      limit: 4
    '5':
      require-level: 900
      price: 450000
      limit: 5

  # Maximum players of an island, owner included.
  team-limit:
    '1':
      limit: 5
    '2':
      require-level: 150
      price: 40000
      limit: 6
    '3':
      require-level: 350
      price: 120000
      limit: 7
    '4':
      require-level: 700
      price: 300000
      limit: 8
    '5':
      require-level: 1200
      price: 700000
      limit: 9

  # Maximum homes of each island member.
  home-limit:
    '1':
      limit: 1
    '2':
      require-level: 75
      price: 20000
      limit: 2
    '3':
      require-level: 200
      price: 60000
      limit: 3
    '4':
      require-level: 400
      price: 150000
      limit: 4
    '5':
      require-level: 750
      price: 350000
      limit: 5

  # Maximum warps of an island.
  warp-limit:
    '1':
      limit: 1
    '2':
      require-level: 75
      price: 20000
      limit: 2
    '3':
      require-level: 200
      price: 60000
      limit: 3
    '4':
      require-level: 400
      price: 150000
      limit: 4
    '5':
      require-level: 750
      price: 350000
      limit: 5

  # Biomes members may set with /is biome. Biome keys, spelled as the command does.
  biomes:
    '1':
      allowed:
        - PLAINS
    '2':
      require-level: 125
      price: 30000
      allowed:
        - PLAINS
        - FOREST
        - BIRCH_FOREST
        - CHERRY_GROVE
    '3':
      require-level: 300
      price: 100000
      allowed:
        - PLAINS
        - FOREST
        - BIRCH_FOREST
        - CHERRY_GROVE
        - JUNGLE
        - BADLANDS
        - DESERT
        - SAVANNA
    '4':
      require-level: 650
      price: 250000
      allowed:
        - PLAINS
        - FOREST
        - BIRCH_FOREST
        - CHERRY_GROVE
        - JUNGLE
        - BADLANDS
        - DESERT
        - SAVANNA
        - SNOWY_PLAINS
        - TAIGA
        - DARK_FOREST
        - MANGROVE_SWAMP
    '5':
      require-level: 1100
      price: 550000
      allowed:
        - PLAINS
        - FOREST
        - BIRCH_FOREST
        - CHERRY_GROVE
        - JUNGLE
        - BADLANDS
        - DESERT
        - SAVANNA
        - SNOWY_PLAINS
        - TAIGA
        - DARK_FOREST
        - MANGROVE_SWAMP
        - STONY_PEAKS
        - MEADOW
        - GROVE
        - WINDSWEPT_HILLS
