# ===================================================================
# NewSky Configuration
#
# Design:
# - `server`   : per-server identity (the only section that usually differs)
# - everything else: usually the same across all servers in the network
# ===================================================================

# ===================================================================
# Server Identity (per-server)
# ===================================================================
server:
  # Must match the server name in your BungeeCord / Velocity config.
  name: "server1"

  # If true, this server acts as a lobby-only node and will NOT load islands.
  lobby-only: false


# ===================================================================
# Database
# ===================================================================
# Stores persistent island/player data.
mysql:
  host: "localhost"
  port: 3306
  database: "newsky"
  username: "root"
  password: "password"

  # Whether to use SSL for the database connection.
  use-ssl: false

  # JDBC properties appended to the connection URL.
  # Format: "key1=value1&key2=value2"
  # socketTimeout bounds a query whose reply never arrives, so a black-holed socket
  # cannot block an async thread indefinitely. Keep it ABOVE the database server's
  # innodb_lock_wait_timeout (50s by default) so a genuine row-lock wait still ends in
  # InnoDB's own error on a reusable connection instead of a killed socket.
  properties: "autoReconnect=true&useUnicode=true&characterEncoding=utf8&connectTimeout=10000&socketTimeout=60000"

  # Table prefix for all plugin tables.
  prefix: "newsky_"

# ===================================================================
# Redis
# ===================================================================
# Used for cross-server communication and centralized caching.
redis:
  host: "localhost"
  port: 6379
  password: ""

  # Use these to separate multiple independent NewSky networks sharing the same Redis (should be identical on all servers in the same network).
  database: 0

  # Cross-server messaging uses Redis Streams with per-server inbox keys.


# ===================================================================
# Network
# ===================================================================
network:
  # Heartbeat period (seconds).
  # Other servers use this to detect whether this server is still active.
  heartbeat-interval-seconds: 5

  # Server selection strategy used when choosing an island server / lobby server.
  # Options: "random", "round-robin", "mspt"
  selector: "round-robin"

  # MSPT refresh period (seconds). Only used when selector = "mspt".
  mspt-update-interval-seconds: 10


# ===================================================================
# Lobby Fallback
# ===================================================================
# Where players are sent when they must leave an island forcibly
# (e.g., island unload/delete/lock, expelled, etc.).
lobby:
  # Names must match BungeeCord / Velocity server names.
  # Multiple servers are supported for load balancing.
  server-names:
    - "lobby"

  # Lobby world name (must exist on all lobby servers above).
  world-name: "world"

  # Fallback spawn location inside the lobby world.
  location:
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0


# ===================================================================
# Island
# ===================================================================
island:
  # Template world folder name under the plugin template directory.
  template: "default"

  # Default island spawn position.
  spawn:
    x: 0
    y: 132
    z: 0
    yaw: 180
    pitch: 0

  # Inactive island unload check interval (seconds).
  island-unload-interval-seconds: 300

  # Gamerules applied to island worlds when they are loaded.
  gamerules:
    keep_inventory: true
    immediate_respawn: false


# ===================================================================
# Upgrades
# ===================================================================
# Each upgrade lists its levels as consecutive integer keys ('1', '2', ...).
# An island with no stored level is at the lowest key. `require-level` is the
# island level needed to buy that level and `price` is charged through Vault
# from the buying member's balance; the lowest level needs neither.
upgrades:
  # Island width in blocks (75 means 75x75).
  island-size:
    '1':
      size: 75
    '2':
      require-level: 200
      price: 60000
      size: 100
    '3':
      require-level: 450
      price: 180000
      size: 125
    '4':
      require-level: 850
      price: 450000
      size: 150
    '5':
      require-level: 1400
      price: 1000000
      size: 175

  # Maximum co-op members of an island.
  coop-limit:
    '1':
      limit: 1
    '2':
      require-level: 100
      price: 25000
      limit: 2
    '3':
      require-level: 250
      price: 80000
      limit: 3
    '4':
      require-level: 500
      price: 200000
      limit: 4
    '5':
      require-level: 900
      price: 450000
      limit: 5

  # Maximum players of an island, owner included.
  team-limit:
    '1':
      limit: 5
    '2':
      require-level: 150
      price: 40000
      limit: 6
    '3':
      require-level: 350
      price: 120000
      limit: 7
    '4':
      require-level: 700
      price: 300000
      limit: 8
    '5':
      require-level: 1200
      price: 700000
      limit: 9

  # Maximum homes of each island member.
  home-limit:
    '1':
      limit: 1
    '2':
      require-level: 75
      price: 20000
      limit: 2
    '3':
      require-level: 200
      price: 60000
      limit: 3
    '4':
      require-level: 400
      price: 150000
      limit: 4
    '5':
      require-level: 750
      price: 350000
      limit: 5

  # Maximum warps of an island.
  warp-limit:
    '1':
      limit: 1
    '2':
      require-level: 75
      price: 20000
      limit: 2
    '3':
      require-level: 200
      price: 60000
      limit: 3
    '4':
      require-level: 400
      price: 150000
      limit: 4
    '5':
      require-level: 750
      price: 350000
      limit: 5


# ===================================================================
# Commands
# ===================================================================
command:
  # Default behavior of `/island` when used with no arguments.
  # Options:
  # - "help"   : show help
  # - "island" : teleport to your island home (players without an island get the no-island message)
  base-command-mode: "island"


# ===================================================================
# Debug
# ===================================================================
# If true, prints more detailed logs.
debug: false
